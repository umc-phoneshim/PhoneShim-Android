name: Build Dev Debug APK

on:
  workflow_dispatch:

  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  build-dev-debug-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run dev debug unit tests
        run: ./gradlew testDevDebugUnitTest

      - name: Run dev debug Android Lint
        run: ./gradlew lintDevDebug

      - name: Build dev debug APK
        run: ./gradlew assembleDevDebug

      - name: Run prod debug Android Lint
        run: ./gradlew lintProdDebug

      - name: Verify prod debug build
        run: ./gradlew assembleProdDebug

      - name: Upload dev debug APK
        uses: actions/upload-artifact@v4
        with:
          name: phoneshim-dev-debug-${{ github.ref_name }}-${{ github.run_number }}
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
          if-no-files-found: error
          retention-days: 7
